<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銷售表現 — Enrich Medical Dashboard</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  svg.chart { width: 100%; height: 260px; display: block; }
  svg.chart.tall { height: 300px; }
  .grid-line { stroke: var(--grid); stroke-width: 1; }
  .axis-text { fill: var(--text-muted); font-size: 11px; }
  .bar-rev { fill: var(--series-blue); }
  .trend-line { fill: none; stroke: var(--series-blue); stroke-width: 2; }
  .trend-dot { fill: var(--series-blue); }
  .chart-tip-target { cursor: pointer; }
  .controls { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .controls select {
    font-size: 12.5px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-primary); font-family: inherit;
  }
  .toggle-group { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle-btn {
    background: var(--card); color: var(--text-secondary); border: none; padding: 6px 14px;
    font-size: 12.5px; cursor: pointer; font-family: inherit;
  }
  .toggle-btn.active { background: var(--series-blue); color: #fff; }
  .share-bar-track { position: relative; height: 6px; background: var(--grid); border-radius: 4px; width: 80px; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .share-bar-fill { position: absolute; left: 0; top: 0; height: 6px; border-radius: 4px; background: var(--series-blue); }
</style>
</head>
<body>
<nav class="topnav">
  <span class="brand">Enrich Medical Dashboard</span>
  <a href="index.html">總覽</a>
  <a href="inventory.html">庫存</a>
  <a href="cashflow.html">現金流</a>
  <a href="sales-performance.html" class="active">銷售表現</a>
  <a href="admin.html">✏️ 編輯資料</a>
</nav>
<div class="wrap">
  <h1>銷售表現</h1>
  <p class="subtitle">歷史銷貨資料的分析,跟「庫存」頁的目前庫存量是分開的兩件事 —— 這裡沒有對應的歷史進貨資料,只拿來看賣得好不好,不代表目前實際庫存。</p>

  <div id="kpiRow" class="kpi-row"></div>

  <div class="card">
    <h2>年度營收趨勢</h2>
    <p class="desc">每年含稅營收總額(不含 0 元的內部領用/樣品)</p>
    <svg class="chart" id="yearlyChart" viewBox="0 0 960 260" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="card">
    <h2>品項排行榜</h2>
    <p class="desc">依累計含稅營收排序,「近12個月」是資料裡最後 12 個月的區間,不是目前月份往前推</p>
    <table id="rankingTable">
      <thead>
        <tr>
          <th>品項</th><th class="num">累計數量</th><th class="num">累計金額</th>
          <th>營收佔比</th><th class="num">近12個月數量</th><th class="num">近12個月金額</th>
        </tr>
      </thead>
      <tbody><tr><td colspan="6" class="state-msg">讀取中…</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>單一品項逐月趨勢</h2>
    <p class="desc">選一個品項看它從有紀錄以來每個月的表現</p>
    <div class="controls">
      <select id="itemSelect"></select>
      <div class="toggle-group">
        <button class="toggle-btn active" data-metric="revenue">金額</button>
        <button class="toggle-btn" data-metric="qty">數量</button>
      </div>
    </div>
    <svg class="chart tall" id="itemTrendChart" viewBox="0 0 960 300" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script src="assets/config.js"></script>
<script src="assets/api.js"></script>
<script>
const fmtMoney = n => "$" + Math.round(n).toLocaleString();
const fmtNum = n => Math.round(n).toLocaleString();
const tooltip = document.getElementById("tooltip");

function showTip(e, html) {
  tooltip.style.opacity = "1";
  tooltip.style.left = (e.clientX + 14) + "px";
  tooltip.style.top = (e.clientY - 14) + "px";
  tooltip.innerHTML = html;
}
function hideTip() { tooltip.style.opacity = "0"; }

let perf = null;
let currentMetric = "revenue";

function drawYearly(overallYearly) {
  const svg = document.getElementById("yearlyChart");
  const W = 960, H = 260, padL = 70, padR = 20, padT = 16, padB = 30;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(1, ...overallYearly.map(d => d.revenue));
  const niceMax = Math.ceil(maxVal / 4 / 100000) * 4 * 100000 || maxVal * 1.1;
  const yFor = v => padT + plotH - (v / niceMax) * plotH;

  const groupW = plotW / overallYearly.length;
  const barW = Math.min(56, groupW * 0.5);

  let s = "";
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (niceMax / ticks) * i;
    const y = yFor(v);
    s += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    s += `<text class="axis-text" x="${padL-10}" y="${y+4}" text-anchor="end">${(v/10000).toFixed(0)}萬</text>`;
  }

  overallYearly.forEach((d, i) => {
    const cx = padL + groupW * (i + 0.5);
    const x = cx - barW/2;
    const y = yFor(d.revenue);
    s += `<rect class="bar-rev chart-tip-target" data-i="${i}" x="${x}" y="${y}" width="${barW}" height="${padT+plotH-y}" rx="5"/>`;
    s += `<text class="axis-text" x="${cx}" y="${H-8}" text-anchor="middle">${d.year}</text>`;
  });

  svg.innerHTML = s;
  svg.querySelectorAll(".chart-tip-target").forEach(el => {
    el.addEventListener("mousemove", (e) => {
      const d = overallYearly[+el.dataset.i];
      showTip(e, `<b>${d.year}</b><br>營收:${fmtMoney(d.revenue)}<br>數量:${fmtNum(d.qty)} 件`);
    });
    el.addEventListener("mouseleave", hideTip);
  });
}

function renderRanking(ranking) {
  const tbody = document.querySelector("#rankingTable tbody");
  if (!ranking.length) {
    tbody.innerHTML = '<tr><td colspan="6" class="state-msg">還沒有資料</td></tr>';
    return;
  }
  tbody.innerHTML = ranking.map(r => `
    <tr>
      <td>${r.name}</td>
      <td class="num">${fmtNum(r.totalQty)}</td>
      <td class="num">${fmtMoney(r.totalRevenue)}</td>
      <td><span class="share-bar-track"><span class="share-bar-fill" style="width:${(r.share*100).toFixed(0)}%"></span></span>${(r.share*100).toFixed(1)}%</td>
      <td class="num">${fmtNum(r.last12Qty)}</td>
      <td class="num">${fmtMoney(r.last12Revenue)}</td>
    </tr>
  `).join("");
}

function populateItemSelect(ranking) {
  const sel = document.getElementById("itemSelect");
  sel.innerHTML = ranking.map(r => `<option value="${r.name}">${r.name}</option>`).join("");
}

function drawItemTrend(name, metric) {
  const svg = document.getElementById("itemTrendChart");
  const series = (perf.monthlyByItem[name] || []);
  const W = 960, H = 300, padL = 70, padR = 20, padT = 16, padB = 34;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  if (!series.length) { svg.innerHTML = ""; return; }

  const vals = series.map(d => metric === "revenue" ? d.revenue : d.qty);
  const maxVal = Math.max(1, ...vals);
  const niceMax = maxVal * 1.15;
  const xFor = i => padL + (series.length <= 1 ? plotW/2 : (plotW * i) / (series.length - 1));
  const yFor = v => padT + plotH - (v / niceMax) * plotH;

  let s = "";
  const ticks = 4;
  for (let i = 0; i <= ticks; i++) {
    const v = (niceMax / ticks) * i;
    const y = yFor(v);
    s += `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
    const label = metric === "revenue" ? (v/10000).toFixed(0) + "萬" : Math.round(v).toLocaleString();
    s += `<text class="axis-text" x="${padL-10}" y="${y+4}" text-anchor="end">${label}</text>`;
  }

  // x-axis labels: only show January of each year to avoid clutter
  series.forEach((d, i) => {
    if (d.month.endsWith("-01") || i === 0 || i === series.length - 1) {
      const x = xFor(i);
      s += `<text class="axis-text" x="${x}" y="${H-10}" text-anchor="middle">${d.month}</text>`;
    }
  });

  const points = series.map((d, i) => `${xFor(i)},${yFor(metric === "revenue" ? d.revenue : d.qty)}`).join(" ");
  s += `<polyline class="trend-line" points="${points}"/>`;

  series.forEach((d, i) => {
    const v = metric === "revenue" ? d.revenue : d.qty;
    s += `<circle class="trend-dot chart-tip-target" data-i="${i}" cx="${xFor(i)}" cy="${yFor(v)}" r="3"/>`;
  });

  svg.innerHTML = s;
  svg.querySelectorAll(".chart-tip-target").forEach(el => {
    el.addEventListener("mousemove", (e) => {
      const d = series[+el.dataset.i];
      showTip(e, `<b>${d.month}</b><br>金額:${fmtMoney(d.revenue)}<br>數量:${fmtNum(d.qty)} 件`);
    });
    el.addEventListener("mouseleave", hideTip);
  });
}

document.querySelectorAll(".toggle-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".toggle-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMetric = btn.dataset.metric;
    drawItemTrend(document.getElementById("itemSelect").value, currentMetric);
  });
});
document.getElementById("itemSelect").addEventListener("change", (e) => {
  drawItemTrend(e.target.value, currentMetric);
});

(async function init() {
  const container = document.querySelector(".wrap");
  try {
    const res = await fetchData("salesPerformance");
    perf = res.salesPerformance;
    if (!perf.ranking.length) {
      container.insertAdjacentHTML("beforeend", '<div class="state-msg">還沒有歷史銷貨資料</div>');
      return;
    }

    const grandRevenue = perf.overallYearly.reduce((s,y)=>s+y.revenue,0);
    const grandQty = perf.overallYearly.reduce((s,y)=>s+y.qty,0);
    const last12Revenue = perf.ranking.reduce((s,r)=>s+r.last12Revenue,0);
    const top = perf.ranking[0];
    document.getElementById("kpiRow").innerHTML = `
      <div class="stat-tile"><div class="stat-label">累計營收(全期間)</div><div class="stat-value">${fmtMoney(grandRevenue)}</div></div>
      <div class="stat-tile"><div class="stat-label">累計銷售數量</div><div class="stat-value">${fmtNum(grandQty)}<span class="unit">件</span></div></div>
      <div class="stat-tile"><div class="stat-label">近12個月營收(全品項)</div><div class="stat-value">${fmtMoney(last12Revenue)}</div></div>
      <div class="stat-tile"><div class="stat-label">累計營收最高品項</div><div class="stat-value" style="font-size:20px">${top.name}</div><div class="stat-note">${fmtMoney(top.totalRevenue)}</div></div>
    `;

    drawYearly(perf.overallYearly);
    renderRanking(perf.ranking);
    populateItemSelect(perf.ranking);
    drawItemTrend(perf.ranking[0].name, currentMetric);
  } catch (err) {
    const msg = err.message === "CONFIG_MISSING" ? "config-missing" : "error";
    renderState(container, msg, err.message);
  }
})();
</script>
</body>
</html>
